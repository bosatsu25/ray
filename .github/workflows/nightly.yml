name: Nightly

on:
  push:
    branches: [main]
    paths:
      - shaders/**
      - tools/**
      - pyproject.toml
      - uv.lock
      - .python-version
      - .github/workflows/**

# 連続した push は順番に処理
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    # この Fork の所有者のリポジトリでだけ公開する (さらに Fork された先で勝手に公開されないように)
    if: github.repository_owner == 'bosatsu25'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 既定の浅いクローン (1 件) だとリリースノートの git log -10 が最新の 1 件だけになる
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      # LICENSE同梱
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # バージョンは pyproject.toml を正本にする (上げるときはここだけ直す)
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          sha=${GITHUB_SHA::7}
          # LICENSE 1.4.b: Fork は「Ray」を名前にできない (zip 名とリリースの題も含む)
          name="bosatsu25-fork-${version}-${sha}-nightly"

          mkdir -p "dist/${name}"
          cp -r shaders "dist/${name}/shaders"
          cp LICENSE CREDITS.md "dist/${name}/"
          printf 'commit: %s\nbuilt: %s\n' "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "dist/${name}/BUILD_INFO.txt"
          (cd "dist/${name}" && zip -qr "../${name}.zip" .)

          # LICENSE 1.4.a: 説明の最初の段落に原作の表示と公式の配布先へのリンクを置く
          {
            echo "Based on [Ray](https://github.com/kuwacom/ray) by [kuwacom](https://github.com/kuwacom). これは kuwacom さんの Ray をもとにした非公式の Fork で、公式の配布物ではなく、公認も受けていません。公式の配布先は [kuwacom/ray](https://github.com/kuwacom/ray) です"
            echo
            echo "- \`main\` の最新を反映した nightly ビルドです。push のたびに置き換わり、動作は保証しません"
            echo "- 自動の検査 (コンパイルとリンク) だけを通したビルドで、ゲーム内での動作は確かめていません"
            echo "- この Fork の不具合を公式 (kuwacom/ray) に報告しないでください。報告は [${GITHUB_REPOSITORY}](https://github.com/${GITHUB_REPOSITORY}) へ、この zip のファイル名 (\`${name}.zip\`) を添えてください"
            echo "- ライセンス: Ray Shader License 1.0 (zip 内の LICENSE)"
            echo
            echo "Based on [Ray](https://github.com/kuwacom/ray) by [kuwacom](https://github.com/kuwacom). This is an unofficial fork of Ray. It is not an official release and is not endorsed by kuwacom. The official distribution channel is [kuwacom/ray](https://github.com/kuwacom/ray)."
            echo
            echo "- This is the nightly build of the latest \`main\`. It is replaced on every push and comes with no guarantee."
            echo "- It has only passed automated checks (compile and link). It has not been tested in game."
            echo "- Do not report problems of this fork to the official repository (kuwacom/ray). Report them to [${GITHUB_REPOSITORY}](https://github.com/${GITHUB_REPOSITORY}) with the file name of this zip (\`${name}.zip\`)."
            echo "- License: Ray Shader License 1.0 (the LICENSE inside the zip)."
            echo
            echo "## 直近の変更 / Recent changes"
            git log -10 --format='- %s (%h)'
          } > notes.md

          # 単一の nightly だけを置くため、前のリリースとタグを消して作り直す
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly "dist/${name}.zip" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "bosatsu25 fork nightly (unofficial) (${version}, ${sha})" \
            --notes-file notes.md
